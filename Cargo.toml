[package]
name = "sweetpad"
version = "0.1.0"
edition = "2024"
rust-version = "1.94"
license = "MIT OR Apache-2.0"
description = "Resolver and tooling for Xcode project files (pbxproj, xcconfig, schemes) and build settings."
authors = ["Yevhenii Hyzyla <hyzyla@gmail.com>"]
publish = false

[dependencies]
clap = { version = "4.6.1", features = ["derive"] }

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
missing_errors_doc = "allow"
missing_panics_doc = "allow"
module_name_repetitions = "allow"
# Apple identifiers (ProductType, OpenStep, BuildSystem, etc.) appear in doc
# comments in their natural casing; backtick-wrapping all of them is noise.
doc_markdown = "allow"
